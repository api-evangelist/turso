apis:
- aid: turso:http-database-api
  name: Turso SQL over HTTP API
  description: >-
    HTTP API for executing SQL statements directly against a Turso database instance at the edge. Supports
    query execution via the /v2/pipeline endpoint, health checks, server version retrieval, database dump
    export, schema migration job monitoring, and real-time table change listening (technical preview).
    Designed for edge and serverless environments where WebSocket connections are unavailable.
  humanURL: https://docs.turso.tech/sdk/http/reference
  baseURL: https://{databaseName}-{organizationSlug}.turso.io
  tags:
