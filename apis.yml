apis:
  - aid: turso:platform-api
    name: Turso Platform API
    description: >-
      RESTful management API for programmatically creating and managing Turso
      Cloud databases, groups, organizations, locations, and scoped
      authentication tokens. Used for building multi-tenant architectures,
      automating database provisioning on user signup or agent creation, and
      managing the full lifecycle of libSQL databases in the cloud.
    humanURL: https://docs.turso.tech/api-reference/introduction
    baseURL: https://api.turso.tech
    tags:
      - Database Management
      - Organizations
      - Tokens
      - Groups
    properties:
      - type: Documentation
        url: https://docs.turso.tech/api-reference/introduction
      - type: OpenAPI
        url: openapi/turso-platform-api-openapi.yml
  - aid: turso:http-database-api
    name: Turso SQL over HTTP API
    description: >-
      HTTP API for executing SQL statements directly against a Turso database
      instance at the edge. Supports query execution via the /v2/pipeline
      endpoint, health checks, server version retrieval, database dump export,
      schema migration job monitoring, and real-time table change listening
      (technical preview). Designed for edge and serverless environments where
      WebSocket connections are unavailable.
    humanURL: https://docs.turso.tech/sdk/http/reference
    baseURL: https://{databaseName}-{organizationSlug}.turso.io
    tags:
      - SQL
      - HTTP
      - Edge
      - Serverless
    properties:
      - type: Documentation
        url: https://docs.turso.tech/sdk/http/reference
      - type: Documentation
        url: https://docs.turso.tech/sdk/http/quickstart
  - aid: turso:agentfs-mcp
    name: Turso AgentFS MCP Server
    description: >-
      Model Context Protocol (MCP) server that exposes Turso databases, filesystem
      operations, and key-value storage to AI assistants such as Claude Desktop,
      Cursor, and Windsurf. Enables AI agents to discover optimal regions,
      monitor real-time table changes, and access structured database operations
      in a secure, tool-limited fashion.
    humanURL: https://docs.turso.tech/agentfs/guides/mcp
    tags:
      - MCP
      - AI Agents
      - Model Context Protocol
    properties:
      - type: Documentation
        url: https://docs.turso.tech/agentfs/guides/mcp
      - type: GitHubRepository
        url: https://github.com/tursodatabase/agentfs
