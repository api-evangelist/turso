    url: https://docs.turso.tech/sdk/http/reference
  - type: Documentation
    url: https://docs.turso.tech/sdk/http/quickstart
- aid: turso:agentfs-mcp
  name: Turso AgentFS MCP Server
  description: >-
    Model Context Protocol (MCP) server that exposes Turso databases, filesystem operations, and key-value
    storage to AI assistants such as Claude Desktop, Cursor, and Windsurf. Enables AI agents to discover
    optimal regions, monitor real-time table changes, and access structured database operations in a secure,
    tool-limited fashion.
  humanURL: https://docs.turso.tech/agentfs/guides/mcp
