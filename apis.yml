---
aid: turso
name: Turso
description: >-
  Turso is an edge database platform built on libSQL, a fork of SQLite, offering
  both an embedded in-process database engine and a managed cloud service (Turso
  Cloud) for deploying millions of SQLite databases at the edge. Developers can
  programmatically manage databases, groups, organizations, and authentication
  tokens via the Turso Platform API, and execute SQL queries directly over HTTP
  using the libSQL HTTP API. Turso targets multi-tenant SaaS, AI agent
  architectures, and edge/serverless workloads where per-user or per-agent
  database isolation is required. The platform provides official SDKs for
  TypeScript, Go, Python, and mobile (iOS/Android), a CLI tool, and an MCP
  server integration for AI assistant access.
