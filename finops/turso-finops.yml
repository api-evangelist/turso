principles:
  - name: Visibility
    description: Track Turso Cloud consumption monthly across storage, rows read, rows written, and sync transfer to identify cost drivers per organization and database.
  - name: Optimization
    description: Right-size the plan tier based on actual monthly row operation counts; monitor storage and overage charges to avoid unexpected bills on the free or developer tiers.
  - name: Allocation
    description: Attribute database costs to individual users or tenants by correlating per-database usage with multi-tenant provisioning patterns via the Platform API.
  - name: Forecasting
    description: Use historical row read/write growth trends to forecast when plan tier upgrades become more cost-effective than paying per-billion/million overages.
